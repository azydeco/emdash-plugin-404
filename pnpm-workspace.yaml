# Supply-chain hardening.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

packages:
  - docs
  - hosts/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

catalog:
  '@astrojs/check': ^0.9.7
  '@astrojs/cloudflare': ^14.0.0
  '@astrojs/react': ^6.0.0
  '@cloudflare/workers-types': ^4.20260603.1
  '@emdash-cms/cloudflare': 0.37.0
  '@types/node': ^24.13.3
  astro: ^7.0.0
  emdash: 0.37.0
  react: 19.2.4
  react-dom: 19.2.4
  hono: ^4.13.7
  tsdown: 0.23.0
  typescript: ^7.0.2
  tsx: ^4.23.13
  vitest: ^4.1.8
  wrangler: ^4.129.1
  zod: ^4.5.4
  modern-tar: ^0.8.5

overrides:
  '@cloudflare/vite-plugin': 1.54.9

# Runs every check in CONTRIBUTING.md and dry-runs the Native plugin's npm
# packaging. Publishing stays manual (docs/emdash-plugin-custom-404/packaging.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # A bare vX.Y.Z tag is a Native plugin release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLUGIN: "@azydeco/emdash-plugin-custom-404"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tag runs need main's history to check the tagged commit is on it.
          fetch-depth: ${{ github.ref_type == 'tag' && 0 || 1 }}
          persist-credentials: false

      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Release tag checks
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(node -p "require('./packages/emdash-plugin-custom-404/package.json').version")
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PLUGIN version $manifest_version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          # npm versions are immutable; a tag for a published version is a mistake.
          published=$(pnpm view "$PLUGIN" versions --json)
          if node -e 'process.exit([JSON.parse(process.argv[1])].flat().includes(process.argv[2]) ? 0 : 1)' "$published" "$version"; then
            echo "::error::$PLUGIN@$version is already published on npm"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Before lint: the Listing plugin exports only its built dist/. Also the
      # hosts' only check, since astro check does not run under TypeScript 7.
      - run: pnpm build
      - run: pnpm lint
      # `pnpm test` without the "<package> test:" line prefix, so Vitest's
      # ::error lines start the line and GitHub turns them into annotations.
      - run: pnpm -r --if-present --reporter-hide-prefix run test
      - run: pnpm --filter "$PLUGIN" typecheck

      - name: Package dry run
        run: pnpm --filter "$PLUGIN" check:package --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # act (local runs) sets ACT; its artifact server rejects v7's uploads.
        # The tarball is still in the runner's temp dir from the step above.
        if: ${{ !env.ACT }}
        with:
          name: custom-404-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 14
